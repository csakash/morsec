# cargo-fuzz harness for the dotenv parser (L04). Not a workspace member: it needs nightly and
# libfuzzer. Run with: cd crates/ms-import/fuzz && cargo +nightly fuzz run dotenv
# The same properties run on stable in `cargo test` (ms-import dotenv proptests).
[package]
name = "ms-import-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ms-import = { path = ".." }

# Its own workspace, so the main workspace (and its lockfile and gate) never builds it.
[workspace]

[[bin]]
name = "dotenv"
path = "fuzz_targets/dotenv.rs"
test = false
doc = false
bench = false
