[package]
name = "ms-proxy"
description = "Swap proxy: TLS termination, placeholder substitution, egress policy (built in L05)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Exposes `ms_proxy::fuzzing` for the nightly cargo-fuzz harness in `fuzz/` (L24). Never enabled
# by msd or ms.
fuzzing = []

[dependencies]

ms-core = { workspace = true }
ms-vault = { workspace = true }
ms-receipts = { workspace = true }
ms-approve = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "http1", "http2"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
http = "1.5.0"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustls-pki-types = { version = "1.16.0", features = ["std"] }
rustls-native-certs = "0.8.5"
time = "0.3.55"

[dev-dependencies]
proptest = { workspace = true }
ms-fuzz = { workspace = true }
tempfile = { workspace = true }
ms-vault = { workspace = true }
http-body-util = { version = "0.1.5", features = ["channel"] }
tokio = { workspace = true, features = ["process"] }
tracing-subscriber = { workspace = true }
