[package]
name = "msd"
description = "The morsec broker daemon: vault, rules, receipts, swap proxy and the socket, behind one kill switch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "msd"
path = "src/main.rs"

[dependencies]
ms-core = { workspace = true }
ms-ipc = { workspace = true }
ms-vault = { workspace = true }
ms-rules = { workspace = true }
ms-receipts = { workspace = true }
ms-proxy = { workspace = true }
ms-session = { workspace = true }
ms-approve = { workspace = true, features = ["touch-id"] }
ms-import = { workspace = true }
ms-scan = { workspace = true }
ms-projects = { workspace = true }
ms-run = { workspace = true }
ms-mcp = { workspace = true }
ms-dash = { workspace = true }
ms-connect = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
libc = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# LaunchServices: msd opens the dashboard itself (L32 SPEC D-12). Already locked through ms-ipc.
core-foundation-sys = "0.8"
# The pasteboard for the dashboard's Copy (L33 SPEC D-20). Already locked through ms-approve's
# Touch ID; the same versions and features.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[dev-dependencies]
tempfile = { workspace = true }
ms-run = { workspace = true, features = ["pg-test"] }

# End-to-end test that runs real `ms` commands inside a fake agent. It is its own fake agent:
# copied as `claude`, it runs a shell command as its child (see the file), so it needs its own
# main instead of libtest.
[[test]]
name = "agent_e2e"
path = "tests/agent_e2e.rs"
harness = false
