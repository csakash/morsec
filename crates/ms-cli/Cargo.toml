[package]
name = "ms-cli"
description = "The ms command (also installed as mors)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[[bin]]
name = "ms"
path = "src/main.rs"

[dependencies]
ms-core = { workspace = true }
ms-ipc = { workspace = true }
ms-receipts = { workspace = true }
ms-rules = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
ms-import = { workspace = true }
ms-connect = { workspace = true }
ms-session = { workspace = true }
ms-run = { workspace = true }
ms-mcp = { workspace = true }
ms-approve = { workspace = true }
libc = { workspace = true }
zeroize = { workspace = true }
rustix = { version = "1", default-features = false, features = ["std", "termios", "process"] }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
ms-vault = { workspace = true }
rustix = { version = "1", default-features = false, features = ["std", "termios", "pty"] }
