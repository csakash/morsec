[package]
name = "ms-run"
description = "Run mode: the runner, the ms-shim binary, the streaming redactor and the generic adapter (L12)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "ms-shim"
path = "src/bin/ms-shim.rs"

[features]
# The throwaway Postgres helper (`adapters::pg::test_cluster`) for other crates' tests.
pg-test = []

[dependencies]
ms-core = { workspace = true }
ms-vault = { workspace = true }
ms-ipc = { workspace = true }
ms-scan = { workspace = true }
aho-corasick = "1"
tokio = { workspace = true, features = ["process", "io-std"] }
tracing = { workspace = true }
zeroize = { workspace = true }
rustix = { version = "1", default-features = false, features = ["std", "process", "fs"] }
# L16: ed25519 signing and host-key signature checks (already in the tree through rustls).
ring = "0.17.14"
base64 = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
hex = { workspace = true }
