[package]
name = "ms-dash"
description = "The local dashboard (L32): msd's loopback HTTP listener, its security checks, the read-only API and the embedded page."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ms-core = { workspace = true }
ms-ipc = { workspace = true }
ms-approve = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }
# The same HTTP stack and versions ms-proxy already locks (design §3, SPEC D-2).
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
http = "1.5.0"

[dev-dependencies]
